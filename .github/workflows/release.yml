name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH, no leading v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Record the commit being released
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Reject an already released version
        run: |
          if git rev-parse -q --verify "refs/tags/${{ inputs.version }}" > /dev/null
          then
            echo "error: tag ${{ inputs.version }} already exists" >&2
            exit 1
          fi
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Install Mise and Java
        uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            java = "graalvm-community-25.0.2"
      - name: Set version and open the changelog section
        run: .github/scripts/prepare-release.sh '${{ inputs.version }}'
      - name: Run tests
        run: make test
      # Nothing is committed or tagged until every binary exists. The later jobs
      # rebuild this same edit from the patch, so a failed build leaves main and
      # the tag list untouched and the workflow can just be re-run.
      - name: Save the release edit as a patch
        run: git diff > release.patch
      - name: Upload the patch
        uses: actions/upload-artifact@v7
        with:
          name: release-patch
          path: release.patch
          if-no-files-found: error

  build:
    name: build (${{ matrix.asset }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: git-timeline-macos-arm64
          - os: ubuntu-24.04-arm
            asset: git-timeline-linux-arm64
          - os: ubuntu-latest
            asset: git-timeline-linux-x86_64
    steps:
      - name: Check out the commit being released
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: release-patch
      - name: Apply the release version
        run: git apply release.patch && rm release.patch
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Install Native Image build dependencies
        # Native Image links against the system toolchain and zlib, which the
        # Linux runner images do not ship in full.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - name: Install Mise and Java
        uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            java = "graalvm-community-25.0.2"
      - name: Build binary
        run: make bin
      - name: Package binary
        run: |
          cp -v target/git-timeline .
          tar czf '${{ matrix.asset }}.tar.gz' git-timeline completions
          shasum -a 256 '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.tar.gz.sha256'
      - name: Upload to the workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz*
          if-no-files-found: error

  jar:
    name: build (uber JAR)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit being released
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: release-patch
      - name: Apply the release version
        run: git apply release.patch && rm release.patch
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Install Mise and Java
        uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            java = "graalvm-community-25.0.2"
      - name: Build the uber JAR
        run: make uber
      - name: Package the uber JAR
        run: |
          cp -v target/git-timeline.jar .
          shasum -a 256 git-timeline.jar > git-timeline.jar.sha256
      - name: Upload to the workflow
        uses: actions/upload-artifact@v7
        with:
          name: git-timeline-jar
          path: git-timeline.jar*
          if-no-files-found: error

  release:
    name: release
    needs: [prepare, build, jar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # The binaries were built from prepare's commit. Releasing a main that has
      # moved since would tag a tree nobody built.
      - name: Reject a main that moved during the build
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "${head}" != '${{ needs.prepare.outputs.sha }}' ]]
          then
            echo "error: main moved from ${{ needs.prepare.outputs.sha }} to ${head}" >&2
            exit 1
          fi
      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: release-patch
      - name: Apply the release version
        run: git apply release.patch && rm release.patch
      - name: Commit and tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml CHANGELOG.md src/main/java/me/hernancerm/GitTimeline.java
          git commit -m "chore(release): ${VERSION}"
          git tag "${VERSION}"
          git push origin main
          git push origin "${VERSION}"
      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          pattern: git-timeline-*
          path: dist
          merge-multiple: true
      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          .github/scripts/print-changelog-section.sh "${VERSION}" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*

  bump-formula:
    name: bump-formula
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - name: Require the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${TAP_TOKEN}" ]]
          then
            echo 'error: secret HOMEBREW_TAP_TOKEN is not set. The release itself succeeded;' >&2
            echo 'set the secret and bump the tap by hand, or re-run this job.' >&2
            exit 1
          fi
      - name: Check out git-timeline
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # Both must land after the checkout above: it cleans the workspace root.
      - name: Download the checksums
        uses: actions/download-artifact@v8
        with:
          pattern: git-timeline-*
          path: dist
          merge-multiple: true
      - name: Check out the tap
        uses: actions/checkout@v7.0.1
        with:
          repository: hernancerm/formulas
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render the formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .github/scripts/render-formula.sh "${VERSION}" dist > tap/Formula/git-timeline.rb
      - name: Open a pull request
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "git-timeline-${VERSION}"
          git add Formula/git-timeline.rb
          git commit -m "chore(git-timeline): upgrade git-timeline to ${VERSION}"
          git push origin "git-timeline-${VERSION}"
          printf '%s\n' \
            'Generated by the git-timeline release workflow.' \
            "Checksums come from ${REPO_URL}/releases/tag/${VERSION}" > ../pr-body.md
          gh pr create \
            --repo hernancerm/formulas \
            --base main \
            --head "git-timeline-${VERSION}" \
            --title "chore(git-timeline): upgrade git-timeline to ${VERSION}" \
            --body-file ../pr-body.md

  next-snapshot:
    name: next-snapshot
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Install Mise and Java
        uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            java = "graalvm-community-25.0.2"
      - name: Bump to the next snapshot
        run: .github/scripts/start-next-snapshot.sh '${{ needs.prepare.outputs.version }}'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/java/me/hernancerm/GitTimeline.java
          git commit -m 'chore: start next development iteration'
          git push origin main
